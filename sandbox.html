<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Iframe Viewer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
  }
  iframe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    display: block;
  }
  #message {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    color: #ccc;
    background: #111;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<div id="message">
  No source provided. Add <code>?src=https://example.com</code> to the URL.
</div>
<iframe
  id="viewer"
  style="display:none;"
  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
  referrerpolicy="no-referrer"
  loading="eager"
></iframe>

<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const src = params.get('src');
    const iframe = document.getElementById('viewer');
    const message = document.getElementById('message');

    if (src) {
      try {
        // Basic validation to ensure it's a well-formed URL
        const url = new URL(src, window.location.href);
        iframe.src = url.href;
        iframe.style.display = 'block';
        message.style.display = 'none';
      } catch (e) {
        message.textContent = 'Invalid URL provided in ?src=';
      }
    }
  })();
</script>

</body>
</html>
